<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">شماتیک موتیف تک‌قطعه</title><desc id="d">نمونه مفهومی موتیف گل‌مانند؛ تصویر واقعی اثر نیست.</desc><rect width="900" height="500" rx="24" fill="#fbf5eb"/><rect x="24" y="24" width="852" height="452" rx="18" fill="none" stroke="#c9a227" stroke-width="3"/><text x="450" y="68" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="28" fill="#2c1810">موتیف تک‌قطعه</text><g transform="translate(450 255)" stroke="#5c3a21" stroke-width="4" fill="#d9b66b"><ellipse cy="-70" rx="35" ry="65"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(45)"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(90)"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(135)"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(180)"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(225)"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(270)"/><ellipse cy="-70" rx="35" ry="65" transform="rotate(315)"/><circle r="38" fill="#8b5a2b"/><circle r="16" fill="#e8d5a3"/></g><text x="450" y="420" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="18" fill="#5c3a21">نمونهٔ شماتیک برای توضیح شکل مستقل و تکرارپذیر</text><text x="450" y="452" text-anchor="middle" font-family="Tahoma,sans-serif" font-size="15" fill="#6b4e3d">شماتیک آموزشی — نه عکس یک اثر واقعی</text></svg>